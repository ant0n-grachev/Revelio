<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Revelio</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f8fb;
      --surface: #fff;
      --text: #17213a;
      --muted: #526078;
      --border: #dce1eb;
      --accent: #ffcf64;
      --on-accent: #272011;
      --focus: #775100;
      --warning-bg: #fff0d0;
      --warning-text: #694800;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #101624;
        --surface: #1b2435;
        --text: #edf1fa;
        --muted: #b8c3d7;
        --border: #3a4860;
        --focus: #ffd574;
        --warning-bg: #382b14;
        --warning-text: #ffe19b;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      width: 368px;
      margin: 0;
      padding: 15px;
      background: var(--background);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, sans-serif;
    }

    .brand { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
    .brand img { display: block; }
    h1 { margin: 0; font-size: 20px; line-height: 1.15; letter-spacing: -.025em; }

    .controls, .finding {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }
    .controls { display: grid; gap: 9px; padding: 10px; }
    .tolerance { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    label { font-weight: 600; }
    button, select {
      min-height: 31px;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }
    button { cursor: pointer; font-weight: 600; }
    button:disabled { cursor: default; opacity: .55; }
    :is(button, select, summary):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .actions { display: flex; gap: 6px; }
    .actions > button { flex: 1; }
    #scan { background: var(--accent); border-color: transparent; color: var(--on-accent); }
    #report-actions button { font-size: 12px; }
    #status { margin: 10px 1px 0; font-weight: 600; overflow-wrap: anywhere; }

    #coverage {
      margin-top: 7px;
      padding: 7px 9px;
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
    }
    #coverage.warning { background: var(--warning-bg); color: var(--warning-text); }
    details { color: var(--muted); font-size: 12px; }
    summary { cursor: pointer; }
    #root-details { margin: 7px 1px 0; }
    #roots { max-height: 100px; margin: 4px 0 0; padding-inline-start: 20px; overflow: auto; overflow-wrap: anywhere; }

    #results {
      display: grid;
      gap: 6px;
      max-height: 295px;
      overflow: auto;
      margin: 8px 0 0;
      padding: 2px;
      list-style: none;
    }
    .finding { min-width: 0; padding: 9px; overflow-wrap: anywhere; }
    .finding-title { color: var(--muted); font-size: 11px; font-weight: 650; }
    .snippet {
      margin: 3px 0 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
    }
    .finding-footer { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .finding-details { flex: 1; min-width: 0; padding-top: 4px; }
    .finding-details p { margin: 4px 0 0; }
    .reasons { margin: 4px 0 0; padding-inline-start: 16px; }
    .locate { flex-shrink: 0; min-height: 27px; padding: 3px 7px; font-size: 11px; }
    #coverage-note { margin: 7px 1px 0; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="icon32.png" width="22" height="22" alt="">
    <h1>Revelio</h1>
  </header>
  <div class="controls">
    <div class="tolerance">
      <label for="tolerance">Tolerance</label>
      <select id="tolerance">
        <option value="everything">Everything</option>
        <option value="sweep">Sweep</option>
        <option value="default" selected>Default</option>
        <option value="precise">Precise</option>
      </select>
    </div>
    <div class="actions">
      <button id="scan" type="button">Scan this page</button>
      <button id="cancel" type="button" hidden>Cancel scan</button>
    </div>
    <div id="report-actions" class="actions" hidden>
      <button id="clear" type="button" disabled>Clear report</button>
      <button id="copy" type="button" disabled>Copy JSON</button>
    </div>
  </div>
  <div id="status" role="status">Loading…</div>
  <div id="coverage" hidden></div>
  <details id="root-details" hidden>
    <summary>Root coverage</summary>
    <ul id="roots"></ul>
  </details>
  <ol id="results" aria-label="Scan findings" role="list" hidden></ol>
  <p id="coverage-note" hidden>Scans run locally and cover accessible content.</p>
  <script src="protocol.js"></script>
  <script src="popup.js"></script>
</body>
</html>
